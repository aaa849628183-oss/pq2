<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人主页</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="profile">
      <div class="avatar">👨‍💻</div>
      <h1 id="name">你好，我是开发者</h1>
      <p class="tagline">热爱编程 · 保持好奇 · 探索技术</p>
      <button id="themeToggle" class="btn">切换主题</button>
    </header>

    <main>
      <section class="card">
        <h2>关于我</h2>
        <p>欢迎访问我的个人网站！这里记录我的项目和想法。</p>
      </section>

      <section class="card">
        <h2>技能栈</h2>
        <ul class="skills">
          <li>HTML5</li>
          <li>CSS3</li>
          <li>JavaScript</li>
        </ul>
      </section>

      <section class="card">
        <h2>联系方式</h2>
        <p>Email: <a href="mailto:example@example.com">example@example.com</a></p>
        <p>GitHub: <a href="https://github.com" target="_blank" rel="noopener noreferrer">github.com</a></p>
      </section>
    </main>

    <footer>
      <p>&copy; <span id="year"></span> 我的个人网站</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
